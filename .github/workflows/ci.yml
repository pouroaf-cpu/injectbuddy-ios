name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Unit Tests
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # CI MUST track the Xcode MAJOR the Mac builds with — currently 16 (local is
      # 16.2, iOS 18.3.1 simulators). This is not a preference. `xcodegen` writes
      # objectVersion 77, which only Xcode 16+ can open, so a 15.x toolchain fails with
      # "the project cannot be opened because it is in a future Xcode project file
      # format (77)" — the workflow generating a project its own toolchain cannot read.
      #
      # The fix is the version bump, NOT pinning xcodegen down to emit format 76: that
      # would make CI build a project shaped differently from the one built locally,
      # which is a worse trade than tracking the version.
      #
      # Discovered rather than hard-coded, so a patch bump on the runner image cannot
      # turn this red again.
      - name: Select Xcode 16
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "::error::No Xcode 16 on this runner image. Available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          echo "Selected $XC"
          "$XC/Contents/Developer/usr/bin/xcodebuild" -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # CI deliberately uses NO repo secrets. The unit suite needs the project to
      # COMPILE, and project.yml requires Config/Secrets.xcconfig to EXIST — it does
      # not need the values to be real, and nothing in CI talks to Supabase. The
      # placeholder below is intentionally, visibly fake.
      - name: Write placeholder Config/Secrets.xcconfig (no secrets used)
        run: |
          mkdir -p Config
          cat > Config/Secrets.xcconfig <<'EOF'
          // GENERATED BY CI — NOT A CREDENTIAL. DO NOT COPY, DO NOT COMMIT.
          //
          // These values are placeholders written by .github/workflows/ci.yml on every
          // run. CI does not use repo secrets and never reaches Supabase; this file
          // exists only because project.yml lists it in configFiles, so the build
          // fails without it. .invalid is a reserved TLD (RFC 2606) and can never
          // resolve. Any build made from this file cannot sign in or read data.
          SUPABASE_HOST = ci-placeholder.invalid
          SUPABASE_ANON_KEY = not-a-real-key-ci-placeholder-do-not-use
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # `xcodebuild test` needs a CONCRETE destination. `generic/platform=iOS Simulator`
      # is a build-only destination and test rejects it — that was the failure sitting
      # behind the toolchain one. Discovered from the image rather than named, so a
      # device-lineup change on the runner cannot turn this red either.
      - name: Choose a simulator destination
        run: |
          set -euo pipefail
          SIM=$(xcrun simctl list devices available --json \
                | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(v['udid'] for rt in sorted(d) if 'iOS' in rt for v in d[rt] if v.get('isAvailable')))")
          echo "SIM_UDID=$SIM" >> "$GITHUB_ENV"
          xcrun simctl list devices available | sed -n '1,40p'
          echo "Selected simulator $SIM"

      # Unit tests only. The XCUITest target needs QA credentials reaching the runner
      # via the TEST_RUNNER_ prefix, and CI deliberately holds no secrets — a UI suite
      # without them SKIPS EVERY TEST AND EXITS 0, which is a green that proves nothing.
      # Better to not run it here than to run a check that cannot fail.
      - name: Build & run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project InjectBuddy.xcodeproj \
            -scheme InjectBuddy \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -only-testing:InjectBuddyTests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
