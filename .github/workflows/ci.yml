name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Unit Tests
    runs-on: macos-14

    env:
      # Xcode 15.4 ships a current iOS 17 simulator runtime on macos-14 runners.
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      # CI deliberately uses NO repo secrets. The unit suite needs the project to
      # COMPILE, and project.yml requires Config/Secrets.xcconfig to EXIST — it does
      # not need the values to be real, and nothing in CI talks to Supabase. The
      # placeholder below is intentionally, visibly fake.
      - name: Write placeholder Config/Secrets.xcconfig (no secrets used)
        run: |
          mkdir -p Config
          cat > Config/Secrets.xcconfig <<'EOF'
          // GENERATED BY CI — NOT A CREDENTIAL. DO NOT COPY, DO NOT COMMIT.
          //
          // These values are placeholders written by .github/workflows/ci.yml on every
          // run. CI does not use repo secrets and never reaches Supabase; this file
          // exists only because project.yml lists it in configFiles, so the build
          // fails without it. .invalid is a reserved TLD (RFC 2606) and can never
          // resolve. Any build made from this file cannot sign in or read data.
          SUPABASE_HOST = ci-placeholder.invalid
          SUPABASE_ANON_KEY = not-a-real-key-ci-placeholder-do-not-use
          EOF

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('project.yml') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build & run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project InjectBuddy.xcodeproj \
            -scheme InjectBuddy \
            -destination 'generic/platform=iOS Simulator' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
