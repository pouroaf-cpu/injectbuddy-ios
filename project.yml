name: InjectBuddy

options:
  bundleIdPrefix: com.injectbuddy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # set on the Mac (or via Secrets.xcconfig) for device signing
    CODE_SIGN_STYLE: Automatic

configs:
  Debug: debug
  Release: release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.1"

targets:
  InjectBuddy:
    type: application
    platform: iOS
    # Secrets.xcconfig (gitignored) supplies SUPABASE_URL + SUPABASE_ANON_KEY.
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: Sources/InjectBuddy
      # The onboarding flow. SPEC-ONBOARDING §1: "Both targets include the
      # folder." The real app mounts the flow later, between DisclaimerGate and
      # RootView — that wiring is deliberately NOT done yet, so today this only
      # compiles OnboardingKit into the app. It is here now so the boundary is
      # enforced by the app's own build from the first commit: OnboardingKit
      # must not depend on Core/Backend, Core/Auth or anything in Features/.
      - path: Sources/OnboardingKit
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.injectbuddy.ios
        INFOPLIST_FILE: Sources/InjectBuddy/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        SUPPORTS_MACCATALYST: "NO"
        # SUPABASE_HOST / SUPABASE_ANON_KEY come in from Config/Secrets.xcconfig and
        # are surfaced to runtime through Info.plist ($(SUPABASE_HOST)). SupabaseConfig
        # prepends https:// (xcconfig treats // as a comment, so we can't store a full URL).
    info:
      path: Sources/InjectBuddy/Resources/Info.plist
      properties:
        CFBundleDisplayName: InjectBuddy
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        # Deep-link scheme for BOTH Discord OAuth and the signup email-confirmation
        # link. Must match SupabaseConfig.oauthRedirectURL
        # (com.injectbuddy.ios://login-callback) and the Supabase dashboard →
        # Auth → URL Configuration redirect allow-list. Declared HERE, not by hand in
        # Info.plist: `info:` makes XcodeGen regenerate that file, so a hand edit is
        # silently destroyed on the next `xcodegen generate` (it was, on 2026-07-31).
        CFBundleURLTypes:
          - CFBundleURLName: com.injectbuddy.ios.oauth
            CFBundleURLSchemes:
              - com.injectbuddy.ios
        # Single-window SwiftUI app; no multi-scene support.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # No non-exempt encryption — skips the export-compliance prompt on every
        # TestFlight/App Store upload.
        ITSAppUsesNonExemptEncryption: false
        # InjectBuddy is LIGHT ONLY. This key — not `.preferredColorScheme` — is
        # what forces light on the surfaces SwiftUI cannot reach: system
        # keyboards, share sheets, alerts, the photo picker, SFSafariViewController
        # and the launch screen. A view modifier leaves all of those dark on a
        # dark-mode device. `.preferredColorScheme(.light)` in InjectBuddyApp is
        # kept alongside it as belt-and-braces, not as the mechanism.
        # Declared HERE for the same reason as CFBundleURLTypes above: `info:`
        # makes XcodeGen regenerate Info.plist, so a hand edit is destroyed on the
        # next `xcodegen generate`.
        UIUserInterfaceStyle: Light

  # ── OnboardingPreview ──────────────────────────────────────────────────────
  # A SECOND APP TARGET in this same project (docs/SPEC-ONBOARDING.md §1) whose
  # root view IS the onboarding flow: launch it and you are on screen 1. No
  # auth, no RootView gate, no Supabase, no network — which is the point, since
  # sign-in is the measured bottleneck on this rig.
  #
  # It takes NO configFile (Secrets.xcconfig is Supabase's) and NO Supabase
  # package dependency. If either ever becomes necessary to make this target
  # build, that is a finding about the OnboardingKit boundary, not a fix.
  OnboardingPreview:
    type: application
    platform: iOS
    sources:
      - path: Sources/OnboardingPreview
      - path: Sources/OnboardingKit
      # The one allowed dependency out of the app: SPEC §1 permits Core/Theme.
      # Included by PATH rather than by target dependency precisely so the app
      # target's other Core folders cannot come with it.
      - path: Sources/InjectBuddy/Core/Theme
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.injectbuddy.ios.onboardingpreview
        INFOPLIST_FILE: Sources/OnboardingPreview/Resources/Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
    info:
      path: Sources/OnboardingPreview/Resources/Info.plist
      properties:
        CFBundleDisplayName: Onboarding
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        # LIGHT ONLY, same as the app. This key — not `.preferredColorScheme` —
        # is what reaches the surfaces SwiftUI cannot.
        UIUserInterfaceStyle: Light

  InjectBuddyUITests:
    # Drives the app through the automation/accessibility layer INSIDE the
    # simulator runtime. It does not post CGEvents and does not go through the
    # host window server — which is what makes it work when synthesized clicks
    # are dead, and what makes the control-to-engine wiring testable at all.
    # The 27 unit tests cover CalculatorEngine and DoseProjection; they stayed
    # green through a bug where the field showed 100 and the engine computed 300.
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/InjectBuddyUITests
    dependencies:
      - target: InjectBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.injectbuddy.ios.uitests
        GENERATE_INFOPLIST_FILE: "YES"

  InjectBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/InjectBuddyTests
    dependencies:
      - target: InjectBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.injectbuddy.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  InjectBuddy:
    build:
      targets:
        InjectBuddy: all
        InjectBuddyTests: [test]
        InjectBuddyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InjectBuddyTests
        - InjectBuddyUITests

  # Its own scheme so the flow can be launched without building or signing into
  # the app. No test action: this pass ships no tests for it.
  OnboardingPreview:
    build:
      targets:
        OnboardingPreview: all
    run:
      config: Debug
