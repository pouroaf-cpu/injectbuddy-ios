name: InjectBuddy

options:
  bundleIdPrefix: com.injectbuddy
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # set on the Mac (or via Secrets.xcconfig) for device signing
    CODE_SIGN_STYLE: Automatic

configs:
  Debug: debug
  Release: release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.5.1"

targets:
  InjectBuddy:
    type: application
    platform: iOS
    # Secrets.xcconfig (gitignored) supplies SUPABASE_URL + SUPABASE_ANON_KEY.
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: Sources/InjectBuddy
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.injectbuddy.ios
        INFOPLIST_FILE: Sources/InjectBuddy/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        SUPPORTS_MACCATALYST: "NO"
        # SUPABASE_HOST / SUPABASE_ANON_KEY come in from Config/Secrets.xcconfig and
        # are surfaced to runtime through Info.plist ($(SUPABASE_HOST)). SupabaseConfig
        # prepends https:// (xcconfig treats // as a comment, so we can't store a full URL).
    info:
      path: Sources/InjectBuddy/Resources/Info.plist
      properties:
        CFBundleDisplayName: InjectBuddy
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)

  InjectBuddyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/InjectBuddyTests
    dependencies:
      - target: InjectBuddy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.injectbuddy.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  InjectBuddy:
    build:
      targets:
        InjectBuddy: all
        InjectBuddyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - InjectBuddyTests
